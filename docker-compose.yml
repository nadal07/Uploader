version: '3.8'

services:
  # Main Uploader & Streaming Application Server
  uploader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudflare_uploader
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent app metadata & upload buffer
      - ./uploads:/app/uploads

      # ==========================================================
      # ACTUAL SYSTEM FOLDERS (Host machine directories)
      # Mount any real folders from your host machine below:
      # e.g.: - /mnt/storage:/mnt/storage
      #       - /home/user/Videos:/storage/videos
      #       - /media/movies:/media/movies
      # ==========================================================
      - ./storage:/storage

    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_PASSWORD=admin123

  # Optional Cloudflare Tunnel container
  # Uncomment and add your TUNNEL_TOKEN if you want Cloudflare Tunnel running in Docker!
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflare_tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=YOUR_CLOUDFLARE_TUNNEL_TOKEN_HERE
